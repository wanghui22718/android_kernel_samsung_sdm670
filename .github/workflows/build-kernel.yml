name: Build Kernel (SDM670)

on:
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: gpu-oc # Target the specific branch
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git gnupg gperf \
            liblz4-tool libncurses5-dev libssl-dev python3 python2 unicode-data \
            zlib1g-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libarchive-tools

      - name: Setup Toolchain (Clang)
        run: |
          mkdir toolchain
          cd toolchain
          # Using Proton Clang (standard for Android kernel builds)
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$(pwd)/toolchain/clang/bin:$PATH
          
          # Change this to match your actual defconfig name
          DEFCONFIG=sdm670-perf_defconfig
          
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            $DEFCONFIG

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Check for Kernel Image
        run: |
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
              echo "Build successful!"
          else
              echo "Build failed! Image.gz-dtb not found."
              exit 1
          fi

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-SDM670-GPU-OC
          path: out/arch/arm64/boot/Image.gz-dtb
