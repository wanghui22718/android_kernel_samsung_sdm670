name: Build Kernel (gts4lvwifi)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: gpu-oc
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git gnupg gperf \
            liblz4-tool libncurses5-dev libssl-dev python3 python2 unicode-data \
            zlib1g-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libarchive-tools

      - name: Setup Toolchain (Proton Clang)
        run: |
          mkdir toolchain
          cd toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          # 1. Setup Environment
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$(pwd)/toolchain/clang/bin:$PATH
          
          # Configuration name provided by you
          # Note: In this repo, it is located in the 'vendor/' subfolder
          DEFCONFIG=gts4lvwifi_defconfig
          
          # 2. Initialize the .config file
          make -j$(nproc --all) O=out ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            $DEFCONFIG
          

          # 4. Compile the kernel
          make -j$(nproc --all) O=out ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \

      - name: Check for Output
        run: |
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
              echo "SUCCESS: Image.gz-dtb found"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
              echo "SUCCESS: Image.gz found"
          else
              echo "ERROR: Kernel image not found. Check build logs above."
              exit 1
          fi

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-gts4lvwifi-GPU-OC
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
